name: Build, Prerender, Assert & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build React App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  prerender:
    name: Playwright Prerender
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Prerender all sitemap URLs
        run: node scripts/prerender.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dist-prerendered
          path: dist
          retention-days: 1

  assert:
    name: SEO & AI Assertions
    runs-on: ubuntu-latest
    needs: prerender
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: dist-prerendered
          path: dist
      - name: Run SEO + llms.txt assertions
        run: node scripts/assert-seo.mjs

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: assert
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-prerendered
          path: dist
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=roll-onpainting --branch=main
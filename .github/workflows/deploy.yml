name: Build, Prerender, Audit & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-and-build:
    name: Install & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate _redirects from redirect-map.json
        run: bun run generate:redirects
      - name: Build site
        run: bun run build
      - name: Upload base build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-base
          path: dist
          retention-days: 1

  prerender:
    name: Prerender (Playwright)
    needs: install-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist-base
          path: dist
      - name: Detect Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-${{ hashFiles('bun.lock', 'bun.lockb', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-
      - name: Install Playwright Chromium (with system deps)
        run: bunx playwright install --with-deps chromium
      - name: Prerender all sitemap routes
        run: bun run prerender
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-logs
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload prerendered build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-prerendered
          path: dist
          retention-days: 1

  seo-assertions:
    name: SEO & AI Audit
    needs: prerender
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist-prerendered
          path: dist
      - name: Re-generate redirects (sanity check map is in sync)
        run: bun run generate:redirects
      - name: Run SEO + AI assertions
        run: DIST_DIR=dist bun run audit:seo
      - name: Verify prerendered source on a known route
        run: node scripts/verify-prerendered-source.mjs dist /interior-painting
      - name: Upload audited build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-audited
          path: dist
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages
    needs: seo-assertions
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.roll-onpainting.com
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - uses: actions/download-artifact@v4
        with:
          name: dist-audited
          path: dist-audited
      - name: Verify prerendered source before deploy
        run: node scripts/verify-prerendered-source.mjs dist-audited /interior-painting
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-audited --project-name=roll-onpainting --branch=main
      - name: Ping IndexNow (Bing)
        run: node scripts/indexnow-ping.mjs

  live-check:
    name: Live production check
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Assert real status codes on www.roll-onpainting.com
        shell: bash
        run: |
          BASE=https://www.roll-onpainting.com
          check() {  # path expected_code [location_suffix]
            local path="$1" want="$2" loc="${3:-}" code got_loc
            for i in 1 2 3 4 5 6; do
              read -r code got_loc < <(curl -s -o /dev/null -H 'Cache-Control: no-cache' \
                -w '%{http_code} %{redirect_url}\n' "$BASE$path?cb=$GITHUB_RUN_ID-$i" | sed 's/?cb=[^ ]*//')
              if [ "$code" = "$want" ] && { [ -z "$loc" ] || [[ "$got_loc" == *"$loc" ]]; }; then
                echo "OK   $path -> $code $got_loc"; return 0
              fi
              echo "wait $path -> $code $got_loc (want $want $loc), attempt $i"; sleep $((i * 15))
            done
            echo "FAIL $path -> $code $got_loc (want $want $loc)"; return 1
          }
          fail=0
          check /blog/ 200 || fail=1
          check /blog/deck-stain-fading/ 200 || fail=1
          check /this-page-does-not-exist-live-check/ 404 || fail=1
          # Query-string redirect: checked without the cache-buster param.
          for i in 1 2 3 4 5 6; do
            read -r code loc < <(curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' "$BASE/blog/?post=deck-stain-fading")
            if [ "$code" = 301 ] && [[ "$loc" == */blog/deck-stain-fading/ ]]; then echo "OK   /blog/?post=deck-stain-fading -> $code $loc"; break; fi
            echo "wait /blog/?post=deck-stain-fading -> $code $loc, attempt $i"; sleep $((i * 15))
            [ $i = 6 ] && { echo "FAIL /blog/?post=deck-stain-fading -> $code $loc (want 301 */blog/deck-stain-fading/)"; fail=1; }
          done
          exit $fail
